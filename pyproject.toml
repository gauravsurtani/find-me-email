[project]
name = "find-emails"
version = "1.0.0"
description = "Find emails for LinkedIn profile URLs via Apify's harvestapi actor."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.1",
    "python-dotenv>=1.0",
]

[project.scripts]
find-emails = "find_emails:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["find_emails"]
